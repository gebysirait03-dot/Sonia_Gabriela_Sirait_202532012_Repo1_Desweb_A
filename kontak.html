<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirim Cerita - Kopi Sepi Tanpamu</title>
</head>
<body>
  <!-- 202532012_Sonia_Gabriela_Sirait -->

  <header>
    <h1>Kopi Sepi Tanpamu</h1>
    <nav>
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="artikel.html">Artikel</a></li>
        <li><a href="kontak.html">Kirim Cerita</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Kirim Ceritamu</h2>
      <p>Ceritakan kenangan atau momen favoritmu bersama secangkir kopi.</p>

      <form action="terima.html" method="get">
        <p>
          <label for="nama">Nama:</label>
          <input type="text" id="nama" name="nama" required>
        </p>
        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </p>

        <fieldset>
          <legend>Kopi Favoritmu</legend>
          <input type="radio" id="hitam" name="kopi" value="hitam" required>
                <label for="hitam">Kopi Hitam</label>
      <input type="radio" id="susu" name="kopi" value="susu">
      <label for="susu">Kopi Susu</label>
    </fieldset>

    <fieldset>
      <legend>Kamu Minum Kopi Saat</legend>
      <input type="checkbox" id="pagi" name="waktu" value="pagi">
      <label for="pagi">Pagi</label>
      <input type="checkbox" id="malam" name="waktu" value="malam">
      <label for="malam">Malam</label>
    </fieldset>

    <p>
      <button type="submit">Kirim Cerita</button>
    </p>
  </form>
</section>
</main>

<footer>

</footer>
</body>
</html>
